# Retargeter loss configuration for orcahand_v2.
# Joint names match the URDF rendered from orcahand_v2.urdf.xacro.
# Started from the orcahand_v1b values: v1b's thumb_pip is v2's thumb_mcp.
lr: 2.5
loss_func_cfg:
  keyvector_fingers2palm: 2.0
  keyvector_forearm_and_wrist: 2.0
  keyvector_fingers2fingers: 1.0
  zero_regularizor:
    weight: 0.01
    kwargs:
      index_abd:   [0, 1.0]
      middle_abd:  [0, 1.0]
      ring_abd:    [0, 1.0]
      pinky_abd:   [0, 1.0]
      thumb_abd:   [0.7, 0.25]
      thumb_mcp:   [0.7, 0.25]
      wrist:       [0, 2.0]
  # Link each finger's knuckle (mcp) and middle (pip) joint so they bend by about the same
  # amount, like a real finger. Without it the fingertip target is met with odd joint pairs:
  # with an open hand the knuckles of middle, ring and pinky sat on their -25 deg stop
  # (constant motor current, overheating). Added 2026-11-19; tested offline for weights
  # 0.05 to 2.0 with nearly identical results. Comment this block out to switch it off.
  virtual_coupling:
    weight: 1.0
    kwargs:
      index:  [0.2, [[1.0, index_mcp],  [-1.0, index_pip]]]
      middle: [0.2, [[1.0, middle_mcp], [-1.0, middle_pip]]]
      ring:   [0.2, [[1.0, ring_mcp],   [-1.0, ring_pip]]]
      pinky:  [0.2, [[1.0, pinky_mcp],  [-1.0, pinky_pip]]]
  # Earlier, fuller version (with thumb entries), kept for reference:
  # virtual_coupling:
  #   weight: 1.0
  #   kwargs:
  #     "thumb1":
  #       - 5.0 # thumb base vs pp2mp
  #       - [[1.0,  thumb_abd], [-0.2,  thumb_mcp]]
  #     "thumb2":
  #       - 1.0 # thumb pp2mp vs mp2dp
  #       - [[1.0,  thumb_mcp], [-1.0,  thumb_dip]]
  #     "index":
  #       - 1.0 # index
  #       - [[1.0,  index_mcp], [-1.0,  index_pip]]
  #     "middle":
  #       - 1.0 # middle
  #       - [[1.0,  middle_mcp], [-1.0,  middle_pip]]
  #     "ring":
  #       - 1.0 # ring
  #       - [[1.0,  ring_mcp], [-1.0,  ring_pip]]
  #     "pinky":
  #       - 1.0 # pinky
  #       - [[1.0,  pinky_mcp], [-1.0,  pinky_pip]]
